}

.calendar{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;

}

.month{
background:#1e1e1e;
border-radius:10px;
padding:6px;
}

}

.weekdays{
display:grid;
grid-template-columns:repeat(7,1fr);
font-size:8px;
opacity:0.7;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:2px;
font-size:9px;
}

.day{
background:#2b2b2b;
border-radius:3px;
padding:2px;
}

</style>
